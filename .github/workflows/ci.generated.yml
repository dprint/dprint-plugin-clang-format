# GENERATED BY ./ci.ts -- DO NOT DIRECTLY EDIT

name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'
jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-ci-deps
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Check formatting
        run: mise run hygiene
      - name: Lint workflow generation
        run: |-
          ./.github/workflows/ci.ts --lint
          ./.github/workflows/publish_npm.ts --lint
          ./.github/workflows/release.ts --lint
          ./.github/workflows/check_updates.ts --lint
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-ci-deps
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Build and test
        run: mise run test
      - name: Upload plugin Wasm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dprint-plugin-clang-format-wasm
          path: build/plugin.wasm
          if-no-files-found: error
      - name: Setup and test npm deployment
        run: |-
          cd deployment/npm
          npm install
          node setup.js
          npm run test
      - name: Get tag version
        id: get_tag_version
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: 'echo "TAG_VERSION=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"'
      - name: Pre-release
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: |-
          # update config schema to have version
          sed -i 's/dprint-plugin-clang-format\/0.0.0/dprint-plugin-clang-format\/${{ steps.get_tag_version.outputs.TAG_VERSION }}/' deployment/schema.json
          # create release notes
          deno run -A ./scripts/generateReleaseNotes.ts ${{ steps.get_tag_version.outputs.TAG_VERSION }} > ${{ github.workspace }}-CHANGELOG.txt
      - name: Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        if: 'startsWith(github.ref, ''refs/tags/'')'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        with:
          files: |-
            build/plugin.wasm
            deployment/schema.json
          body_path: '${{ github.workspace }}-CHANGELOG.txt'
          draft: false
